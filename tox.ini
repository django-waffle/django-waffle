[tox]
envlist =
    py{310}-django{52}
    py{311}-django{52}
    py{312}-django{52}
    py{313}-django{52}
isolated_build = True

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
allowlist_externals = ./run.sh
deps =
	django52: Django>=5.2,<5.3
	djangomain: https://github.com/django/django/archive/main.tar.gz
	-r{toxinidir}/requirements.txt
commands =
    ./run.sh test

[testenv:i18n]
deps =
	Django>=5.2,<5.3
	-r{toxinidir}/requirements.txt
commands =
    ./run.sh makemessages
    ./run.sh compilemessages
    ./run.sh find_uncommitted_translations

[testenv:typecheck]
deps =
	Django>=5.2,<5.3
	-r{toxinidir}/requirements.txt
commands =
    ./run.sh typecheck
